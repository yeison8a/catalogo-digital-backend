
# Configuración exclusiva para desarrollo local

# Aceptar conexiones solamente desde este computador
server.address=127.0.0.1

# Credenciales de Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Limites para las futuras solicitudes multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB