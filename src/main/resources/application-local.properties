
# Configuración exclusiva para desarrollo local

# Aceptar conexiones solamente desde este computador
server.address=127.0.0.1

# Credenciales de Cloudinary
app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# Limites para las futuras solicitudes multipart
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB


# Procesamiento de eliminaciones pendientes
app.image-deletion.enabled=${IMAGE_DELETION_WORKER_ENABLED:false}

# Revisar trabajos cada 15 segundos
app.image-deletion.poll-ms=15000


# Swagger habilitado en desarrollo local
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# Ordenar las operaciones alfabeticamente
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# Mostrar tiempo de respuesta
springdoc.swagger-ui.display-request-duration=true
