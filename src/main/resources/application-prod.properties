
# ==========================================
# CATALOGO DIGITAL - PRODUCCION
# ==========================================

# SERVIDOR
server.port=${PORT:8080}

# ==========================================
# POSTGRESQL
# ==========================================

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# HIKARICP
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ==========================================
# JPA / HIBERNATE
# ==========================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ==========================================
# SEGURIDAD JWT
# ==========================================

# Clave Base64 de al menos 32 bytes.
# No guardar el secreto directamente aqui.
app.jwt.secret-base64=${JWT_SECRET_BASE64}

# ==========================================
# SWAGGER
# ==========================================

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# ==========================================
# CLOUDINARY
# ==========================================

app.cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
app.cloudinary.api-key=${CLOUDINARY_API_KEY}
app.cloudinary.api-secret=${CLOUDINARY_API_SECRET}

# ==========================================
# IMAGENES
# ==========================================

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# Eliminaciones pendientes
app.image-deletion.enabled=true
app.image-deletion.poll-ms=60000
