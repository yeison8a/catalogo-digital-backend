spring.application.name=catalogo-digital-backend

server.port=8080

# PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/catalogo_digital
spring.datasource.username=${DB_USER:catalogo_user}
spring.datasource.password=${DB_PASSWORD}

# Pool de conexiones
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1