
# ==========================================
# CATALOGO DIGITAL - CONFIGURACION GENERAL
# ==========================================

spring.application.name=catalogo-digital-backend

# Puerto del servidor
server.port=${PORT:8080}

# ==========================================
# POSTGRESQL
# ==========================================

# Desarrollo: PostgreSQL local.
# Produccion: DB_URL definido en el servidor.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/catalogo_digital}
spring.datasource.username=${DB_USER:catalogo_user}
spring.datasource.password=${DB_PASSWORD}

# ==========================================
# HIKARICP
# ==========================================

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1

# ==========================================
# JPA / HIBERNATE
# ==========================================

# Temporalmente se conserva update para
# mantener el comportamiento local actual.
# El perfil prod lo sustituye por validate.
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ==========================================
# SWAGGER
# ==========================================

springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
